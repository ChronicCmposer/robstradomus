AWSTemplateFormatVersion: "2010-09-09"
Description: rob.cmposer.cc static site — private S3 bucket + CloudFront distribution with OAC (bucket and stack in us-east-2; ACM cert must live in us-east-1).

Parameters:
  DomainName:
    Type: String
    Default: rob.cmposer.cc
    Description: Alternate domain name (CNAME) for the CloudFront distribution.
  BucketName:
    Type: String
    Default: rob.cmposer.cc
    Description: Name of the private S3 bucket holding the static site.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for DomainName. Must be in us-east-1 (CloudFront requirement).

Resources:
  # Private bucket. No public access, no versioning, retained on stack deletion.
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      AccessControl: Private
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Origin Access Control: CloudFront signs S3 requests (SIGV4), bucket stays private.
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: OAC for the rob.cmposer.cc S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Bucket policy: only this CloudFront distribution may read objects.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACGetObject
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed-CachingOptimized (honors origin Cache-Control set by publish.sh).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        # SPA-style fallback: 403/404 (missing object, e.g. deep link) serve index.html as 200.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  DistributionId:
    Description: CloudFront distribution ID for rob.cmposer.cc (used by make purge)
    Value: !Ref CloudFrontDistribution
  DistributionDomainName:
    Description: CloudFront distribution domain name — the CNAME target (rob -> this value)
    Value: !GetAtt CloudFrontDistribution.DomainName